<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visual NASA Space Mission Simulator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🚀 Project: Visual Space Mission</h1>
        <p>Design your probe, launch, and navigate safely into stable orbit!</p>
    </header>

    <div class="game-wrapper">
        <!-- Visual Simulation Screen -->
        <section class="simulation-screen">
            <canvas id="spaceCanvas" width="600" height="500"></canvas>
        </section>

        <!-- Command Station Control Dock -->
        <section class="control-dock">
            <div class="telemetry">
                <div>💵 Budget: <span id="budget-txt">$500M</span></div>
                <div>⚖️ Mass: <span id="mass-txt">0 / 1200 kg</span></div>
            </div>

            <div class="shop-section">
                <h3>1. Choose Power Core</h3>
                <button onclick="selectPower('Solar', 100, 200)">Solar Panels (-$100M, +200kg)</button>
                <button onclick="selectPower('Nuclear RTG', 250, 100)">RTG Reactor (-$250M, +100kg)</button>
            </div>

            <div class="shop-section">
                <h3>2. Add Payload</h3>
                <button onclick="addTool('Camera', 50, 100)">Camera (-$50M, +100kg)</button>
                <button onclick="addTool('Radar Sensor', 120, 300)">Radar Sensor (-$120M, +300kg)</button>
            </div>

            <button id="launchBtn" class="launch-action-btn" onclick="startVisualLaunch()">🚀 IGNIITION & LAUNCH</button>
            <div id="game-status">Status: Preparing on Launchpad...</div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
